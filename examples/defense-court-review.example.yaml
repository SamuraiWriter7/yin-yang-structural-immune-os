    requires_future_review: true
    summary: >
      The case was classified as unsafe_structure. Memory strengthening is
      approved, but high-risk automatic escalation remains review-gated.
      The requested operation remains held pending authority verification.

  non_aggression_boundary:
    offensive_action_allowed: false
    allowed_actions:
      - classify_event
      - review_evidence
      - hold
      - verify_authority
      - route_to_human_review
      - update_immune_memory
      - strengthen_memory
      - log
    prohibited_actions:
