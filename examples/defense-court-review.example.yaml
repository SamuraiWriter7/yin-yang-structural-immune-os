    target_memory_id: hdr-001
    reason: >
      Confirmed recurrence of an unsafe structure involving unverified
      authority, urgency pressure, verification bypass, and a sensitive
      operation request.
    review_required_before_escalation: true
    recommended_distribution_scope: system_wide
    recommended_memory_strength: strong

  regulatory_notes:
    false_positive_risk: 0.22
    overreaction_risk: 0.18
    autoimmune_risk: 0.16
    recommendation: require_human_review_before_high_risk_escalation
